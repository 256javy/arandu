server:
  port: ${PORT:8080}

spring:
  application:
    name: arandu-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arandu}
    username: ${SPRING_DATASOURCE_USERNAME:arandu}
    password: ${SPRING_DATASOURCE_PASSWORD:arandu}
    hikari:
      # Serverless Postgres (Neon) suspends when idle; don't pin connections open.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
  servlet:
    multipart:
      # Slightly above the 4 MB the vision endpoint accepts, so it can answer 413 itself.
      max-file-size: 5MB
      max-request-size: 6MB
      # Keep uploads in memory: the photo must never touch the disk.
      file-size-threshold: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

arandu:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  meta:
    base-url: ${META_API_BASE_URL:}
    api-key: ${META_API_KEY:}
    model: ${META_MODEL:muse-spark-1.3}
    # Per role. Muse Spark reasons before answering and reasoning tokens count against max-tokens.
    # Both default to minimal: same eval scores and judge agreement as low, about half the latency
    # (evals/README.md). The old shared META_REASONING_EFFORT / META_MAX_TOKENS are no longer read.
    tutor:
      reasoning-effort: ${META_TUTOR_REASONING_EFFORT:minimal}
      max-tokens: ${META_TUTOR_MAX_TOKENS:2000}
    judge:
      reasoning-effort: ${META_JUDGE_REASONING_EFFORT:minimal}
      max-tokens: ${META_JUDGE_MAX_TOKENS:2000}
    spotlight:
      reasoning-effort: ${META_SPOTLIGHT_REASONING_EFFORT:minimal}
      max-tokens: ${META_SPOTLIGHT_MAX_TOKENS:2000}
