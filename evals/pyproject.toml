[project]
name = "arandu-evals"
version = "0.1.0"
description = "Simulated kids and an LLM judge that score Arandu's tutor against baselines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[project.scripts]
arandu-evals = "arandu_evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arandu_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
